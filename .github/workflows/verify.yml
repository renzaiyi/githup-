name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 只装 jsdom（测试用的 DOM 环境），不需要任何构建工具链
      - name: 安装依赖
        run: npm ci

      # 重新生成产物。
      # 这一步同时是"源码与产物是否同步"的检查 ——
      # 如果提交的 bundle.js 与源码不一致，下一步的 git diff 会失败。
      - name: 重新构建产物
        run: npm run build

      - name: 检查产物是否与源码同步
        run: |
          if ! git diff --quiet -- src/content/bundle.js; then
            echo "::error::src/content/bundle.js 与源码不同步。"
            echo "请在本地运行 npm run build 后重新提交。"
            git diff --stat -- src/content/bundle.js
            exit 1
          fi
          echo "产物与源码同步 ✓"

      - name: 校验 import/export 绑定
        run: npm run bindings

      - name: 运行测试
        run: npm test

      - name: 装机前自检
        run: npm run check
